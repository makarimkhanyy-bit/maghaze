<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>کاسب محل</title>
<style>
:root{--bg:#2b1d12;--fg:#fff3dc;--ac:#e0a43a;--pn:#4a2f1a}
@media(prefers-color-scheme:dark){:root{--bg:#1c130b}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:20px Vazirmatn,Tahoma,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
#g{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:center}
canvas{position:absolute;inset:0}
.t{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:#2b1d12cc;font-weight:bold}
.bt{position:absolute;bottom:0;left:0;right:0;display:flex;gap:6px;padding:6px;background:#2b1d12dd}
.b{flex:1;font:inherit;font-weight:bold;padding:12px 6px;border:0;border-radius:12px;background:var(--ac);color:#2b1d12;min-height:48px}
.b.x{background:#b34a3a;color:#fff}
.q{font:inherit;width:48px;height:44px;border:0;border-radius:10px;background:var(--ac);font-weight:bold}
#m{position:absolute;inset:20px 40px;background:var(--pn);border:4px solid var(--ac);border-radius:18px;padding:14px;display:none;flex-direction:column;gap:10px}
#m h2{margin:0;text-align:center}.bd{flex:1;overflow-y:auto}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px;border-bottom:1px solid #fff3}
.r b{min-width:130px}.s i{display:inline-block;min-width:40px;text-align:center;font-style:normal}
#o{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:#fff7e6;color:#2b1d12;border:3px solid #8a5530;border-radius:16px;padding:10px 16px;display:none;text-align:center;gap:8px;flex-direction:column;min-width:380px}
#o div{display:flex;gap:8px}
#k{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#000b;padding:8px 18px;border-radius:20px;display:none}
#p{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9;text-align:center}
@media(orientation:portrait){#p{display:flex}}
input{font:inherit;padding:8px;border-radius:8px;border:0;width:200px}
</style></head><body>
<div id="g"><canvas id="c" width="960" height="540"></canvas>
<div class="t"><span id="h1"></span><span id="h2"></span><span id="h3"></span></div>
<div id="o"></div><div id="k"></div>
<div class="bt"><button class="b" onclick="buyP()">خرید عمده</button><button class="b" onclick="pp()">قیمت‌ها</button><button class="b" onclick="eqP()">تجهیزات</button><button class="b" onclick="loanP()">قرض</button><button class="b" onclick="teaP()">چای</button><button class="b x" onclick="closeShop()">تعطیلی مغازه</button><button class="b" onclick="menuP()">منو</button></div>
<div id="m"></div></div>
<div id="p">گوشی را به حالت افقی بچرخانید</div>
<script>
const $=i=>document.getElementById(i),fa=n=>(Math.round(n*10)/10).toLocaleString('fa-IR');
// نام، دسته، واحد، شکل، رنگ، قیمت خرید عمده، قیمت فروش، نیاز به یخچال، وزنی  (قیمت‌ها تقریبی و تأییدنشده؛ قابل‌ویرایش)
const P=[['gol','گلاب','سنتی','بطری','b','#e88fb0',55000,70000],['asal','عسل','سنتی','کیلوگرم','j','#d9921a',600000,750000,0,1],['chai','چای','خوراکی','بسته','x','#7a2f1d',250000,300000],['berenj','برنج','خوراکی','کیلوگرم','s','#efe3c0',140000,165000,0,1],['shekar','شکر','خوراکی','کیلوگرم','s','#fff',55000,65000,0,1],['dast','دستکش','نظافتی','جفت','x','#e6d23a',40000,55000],['zarf','مایع ظرف‌شویی','نظافتی','بطری','b','#3fbf6a',70000,90000],['pod','پودر لباسشویی','بهداشتی','بسته','x','#3a7bd5',120000,150000],['roghan','روغن','خوراکی','لیتر','b','#e8c33a',110000,135000],['adas','عدس','خوراکی','کیلوگرم','s','#c0703a',100000,125000,0,1],['mast','ماست محلی','خوراکی','عدد','j','#f4f4ea',45000,60000,1],['kare','کره','سنتی','بسته','x','#f2dc7a',90000,115000,1]];
P.push(['sabon','صابون','بهداشتی','عدد','x','#8fd0e0',20000,28000,0,0,1],['nokhod','نخود','خوراکی','کیلوگرم','s','#d9b86a',90000,115000,0,1,1],['halva','حلوا ارده','سنتی','بسته','j','#8a5a2a',130000,160000,0,0,1],['satl','سطل پلاستیکی','لوازم خانه','عدد','j','#4a90d9',90000,120000,0,0,1]);
P.push(['makaron','ماکارونی','خوراکی','بسته','x','#e8b84a',35000,45000,0,0,1],['rob','رب گوجه','خوراکی','قوطی','j','#c0392b',60000,80000,0,0,1],['sirke','سرکه','خوراکی','بطری','b','#b86a3a',30000,42000,0,0,1],['livan','لیوان شیشه‌ای','لوازم خانه','عدد','j','#cfe3ee',25000,35000,0,0,1]);
const EQ=[['scale','ترازو',800000,'فروش نیم‌کیلویی کالاهای وزنی'],['fridge','یخچال',3000000,'نگهداری ماست و کره'],['shelf','قفسه بزرگ‌تر',2000000,'ظرفیت انبار +۱۰۰'],['counter','پیشخوان بزرگ‌تر',2500000,'مشتری بیشتر، صف بلندتر']];
const K='kaseb_v1';let S,sh,pause=1,started=0,cart={},cs=[],door=0,coins=[],hand=0,spT=2,uid=0,AC,snd=1,mus=1,lk='';
function mk(name){let st={},pr={};P.forEach(p=>{st[p[0]]=(p[8]||p[10])?0:20;pr[p[0]]=p[7]});return{name,money:5000000,debt:0,day:1,t:0,stock:st,sell:pr,eq:{},ds:5000000,rep:0,reg:{},kz:0}}
function load(){try{let d=JSON.parse(localStorage.getItem(K));if(d&&d.v===1&&d.shops&&d.shops[d.cur])return d}catch(e){}return null}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
S=load()||{v:1,cur:'s1',shops:{s1:mk('مغازه‌ی من')}};sh=S.shops[S.cur];fx();sh.rep=sh.rep||0;sh.reg=sh.reg||{};sh.kz=sh.kz||0;
const used=()=>P.reduce((a,p)=>a+sh.stock[p[0]],0),cap=()=>150+(sh.eq.shelf?100:0)+lvl()*30,lvl=()=>Math.min(3,sh.rep/25|0),LV=['دکان','بقالی','سوپر محله','فروشگاه بزرگ'];
function rep(d){let o=lvl();sh.rep=Math.max(0,Math.min(100,sh.rep+d));if(lvl()>o){toast('ارتقا! مغازه‌ی شما شد «'+LV[lvl()]+'»');bell()}}
const REG=[['حاج‌خانم صغری',0,'#7a3a6a','سلام پسرم، گلاب خوب داری؟','چه روزگاری بود... با پدربزرگت چای می‌خوردیم.','بیا، این هم نان‌روغنی خودم.'],['آقا رضا نانوا',3,'#3a6bb0','صبح بخیر! برنج تازه رسیده؟','دماوند این روزها شلوغ شده.','تو بهترین بقال این محله‌ای.'],['معلم احمدی',2,'#4a8a4a','خسته نباشید، چای دارید؟','بچه‌ها از مغازه‌ی شما حرف می‌زنند.','هر کاری داشتی بگو، من هستم.'],['خانم نوری',8,'#c08a2a','روغن می‌خوام، گرون نباشه ها!','زمستان امسال سخت می‌گذره.','ممنون که حواست به ما هست.']];
REG.length=0;REG.push(['آقا رضا نانوا',3,'#3a6bb0','صبح بخیر حاجی! برنج تازه رسیده؟','از قدیم گفتیم: بقال خوب، رفیق خوبه.','نان و نمک تو را هیچ‌وقت فراموش نمی‌کنم.'],['معلم احمدی',2,'#4a8a4a','خسته نباشید حاجی، چای دارید؟','بچه‌ها هنوز از مغازه‌تون حرف می‌زنن.','هر کاری داشتی بگو، رفیق قدیمی هستم.'],['غلام',1,'#6a5a3a','سلام حاجی! یه عسل خوب برام کنار گذاشتی؟','یادته جوون بودیم، تا نصفه‌شب سر همین مغازه می‌نشستیم؟','غلام تا زنده‌ست رفیق توئه، حاجی.',1],['رستگاری',4,'#7a4a3a','بر پیر و جوون سلام! شکر داری، حاجی؟','ما پیرمردها هنوز کم نیاوردیم، نه؟','تو که باشی، این محله بی‌رفیق نمی‌مونه.',1]);
REG[2][4]='هر وقت از جلوی مغازه‌ت رد می‌شم، دلم باز می‌شه.';REG[3][3]='سلام حاجی! شکر داری؟ چایم بی‌شکر نمی‌چسبه.';REG[3][4]='امروز هوای دماوند حال‌وهوای خوبی داره، نه؟';EQ[2][3]='ظرفیت انبار +۱۰۰ و ۸ کالای تازه';
function fx(){P.forEach(p=>{if(sh.stock[p[0]]==null){sh.stock[p[0]]=(p[8]||p[10])?0:20;sh.sell[p[0]]=p[7]}})}
const KZ=['«پدرت و من همکلاسی بودیم. نان را هم نصف می‌کردیم.»','«سی سال پیش این مغازه را با یک ترازوی چوبی شروع کردی. یادته؟»','«یادمه یک زمستان سخت، فقط مغازه‌ی تو باز بود.»','«بچه‌ها بزرگ شدند، دماوند عوض شد، ولی تو هنوز همونی.»','«این مغازه فقط دکان نیست؛ یادگار همه‌ی ماست. آفرین.»'];
function nbP(){panel('همسایه‌ها و اعتبار',REG.map(r=>{let f=sh.reg[r[0]]||0;return`<div class=r><b>${r[0]}</b><span>دوستی: ${fa(f)}</span><span>«${r[3+Math.min(2,f/3|0)]}»</span></div>`}).join('')+`<p>اعتبار: ${fa(sh.rep)} از ۱۰۰ | سطح: ${LV[lvl()]}<br>فروش منصفانه اعتبار می‌آورد و هر سطح مشتری و ظرفیت بیشتری می‌دهد.</p>`)}
function toast(t){let k=$('k');k.textContent=t;k.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>k.style.display='none',2200)}
// ---- صدا
function tone(f,d,ty,v,t0,m){if(!AC||!(m?mus:snd))return;let o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(t0||0);o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.2,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}
const bell=()=>{tone(1200,.7,'sine',.2);tone(1600,.6,'sine',.14,.12)},coin=()=>{tone(1400,.15,'square',.07);tone(2000,.3,'square',.07,.1)},place=()=>tone(160,.1,'triangle',.35);
const SC=[293.7,329.6,349.2,392,440,466.2,523.3];let mi=3;
setInterval(()=>{if(pause)return;mi=Math.max(0,Math.min(6,mi+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));tone(SC[mi],1.4,'triangle',.06,0,1);if(Math.random()<.3)tone(SC[0]/2,2,'sine',.05,0,1)},650);
// ---- پنل‌ها
function panel(t,h){let m=$('m'),o=m.querySelector('.bd'),sc=o?o.scrollTop:0;m.innerHTML='<h2>'+t+'</h2><div class=bd>'+h+'</div><button class=b onclick="cl()">برگشت</button>';m.style.display='flex';pause=1;m.querySelector('.bd').scrollTop=sc}
function cl(){$('m').style.display='none';pause=started?0:1}
function buyP(){let tot=0;let rows=P.map(p=>{let q=cart[p[0]]||0;tot+=q*p[6];let lk=(p[8]&&!sh.eq.fridge)||(p[10]&&!sh.eq.shelf);return`<div class=r><b>${p[1]}</b><span>${p[3]} | موجودی ${fa(sh.stock[p[0]])}</span><span>${fa(p[6])} ت</span>`+(lk?'<span>'+(p[10]?'قفسه بزرگ‌تر لازم است':'یخچال لازم است')+'</span>':`<span class=s><button class=q onclick="cq('${p[0]}',1)">+</button><i>${fa(q)}</i><button class=q onclick="cq('${p[0]}',-1)">−</button></span>`)+'</div>'}).join('');panel('خرید از عمده‌فروشی',rows+`<div class=r><b>جمع: ${fa(tot)} تومان</b><span>انبار ${fa(used())}/${fa(cap())}</span><button class=b onclick="buyGo()">تأیید خرید</button></div>`)}
function cq(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);buyP()}
function buyGo(){let tot=0,n=0;P.forEach(p=>{let q=cart[p[0]]||0;tot+=q*p[6];n+=q});if(!n)return toast('چیزی انتخاب نشده');if(tot>sh.money)return toast('پول کافی نیست');if(used()+n>cap())return toast('انبار جا ندارد');P.forEach(p=>sh.stock[p[0]]+=cart[p[0]]||0);sh.money-=tot;cart={};save();buyP();toast('خرید انجام شد')}
const stp=p=>Math.max(1000,Math.round(p[6]*.05/1000)*1000);
function pp(){panel('قیمت فروش','<button class=b onclick="ppa()">همهٔ قیمت‌ها را پیشنهادی کن</button>'+P.map(p=>{let pf=sh.sell[p[0]]-p[6];return`<div class=r><b>${p[1]}</b><span>خرید ${fa(p[6])}</span><span style="color:#ffe9a0">منصفانه ${fa(p[7])}</span><span class=s><button class=q onclick="sp('${p[0]}',1)">+</button><i style="min-width:90px">${fa(sh.sell[p[0]])}</i><button class=q onclick="sp('${p[0]}',-1)">−</button></span><span style="color:${pf<0?'#ff8a7a':'#9be58a'}">${pf<0?'زیان':'سود'} ${fa(Math.abs(pf))}<br>${fv(p)}</span></div>`}).join('')+'<p>قیمت‌ها تقریبی‌اند و بررسی‌نشده؛ خودتان تنظیم کنید.</p>')}
function sp(i,d){let p=P.find(a=>a[0]==i);sh.sell[i]=Math.max(1000,sh.sell[i]+d*stp(p));save();pp()}
function eqP(){panel('تجهیزات مغازه',EQ.map(e=>`<div class=r><b>${e[1]}</b><span>${e[3]}</span>`+(sh.eq[e[0]]?'<span>خریداری شد</span>':`<button class=b style="flex:0 0 180px" onclick="eqB('${e[0]}')">${fa(e[2])} ت</button>`)+'</div>').join(''))}
function eqB(i){let e=EQ.find(a=>a[0]==i);if(sh.money<e[2])return toast('پول کافی نیست');sh.money-=e[2];sh.eq[i]=1;save();eqP();toast(e[1]+' به مغازه اضافه شد')}
function loanP(){panel('آقای کاظمی',`<p>${KZ[Math.min(KZ.length-1,sh.kz+(sh.day/3|0))]}</p><p>«بدون سود، هر وقت داشتی برگردون.»</p><div class=r><b>بدهی: ${fa(sh.debt)} تومان</b></div><div class=r><button class=b onclick="bw(1000000)">قرض ۱ میلیون</button><button class=b onclick="bw(5000000)">قرض ۵ میلیون</button></div><div class=r><button class=b onclick="rp(1000000)">پرداخت ۱ میلیون</button><button class=b onclick="rp(sh.debt)">تسویه کامل</button></div><p>باقی‌مانده: ${fa(sh.debt)} تومان</p>`)}
function bw(a){sh.money+=a;sh.debt+=a;save();loanP()}
function rp(a){a=Math.min(a,sh.debt,sh.money);if(a<=0)return toast('پولی برای پرداخت نیست');sh.money-=a;sh.debt-=a;sh.kz++;if(!sh.debt&&!sh.kzd){sh.kzd=1;rep(5);toast('آقای کاظمی: آفرین، قرضت صاف شد')}save();loanP()}
function menuP(){panel('منو',`<div class=r><button class=b onclick="snd=!snd;menuP()">صدا: ${snd?'روشن':'خاموش'}</button><button class=b onclick="S.spd=((S.spd|0)+1)%3;save();menuP()">مشتری: ${['سریع','آرام','خیلی آرام'][S.spd|0]}</button><button class=b onclick="mus=!mus;menuP()">موسیقی: ${mus?'روشن':'خاموش'}</button></div><div class=r><button class=b onclick="nbP()">همسایه‌ها و اعتبار</button></div><h3>مغازه‌ها</h3>`+Object.keys(S.shops).map(k=>`<div class=r><b>${S.shops[k].name}</b><span>روز ${fa(S.shops[k].day)} | ${fa(S.shops[k].money)} ت</span><button class=b style="flex:0 0 130px" onclick="sw('${k}')">${k==S.cur?'فعلی':'ورود'}</button></div>`).join('')+`<div class=r><input id=nn placeholder="نام مغازه جدید"><button class=b style="flex:0 0 200px" onclick="ns()">ساخت مغازه</button></div>`)}
function sw(k){S.cur=k;sh=S.shops[k];fx();spT=2;sh.rep=sh.rep||0;sh.reg=sh.reg||{};sh.kz=sh.kz||0;cs=[];save();cl()}
function ns(){let n=$('nn').value.trim();if(!n)return toast('یک نام بنویسید');let k='s'+Date.now();S.shops[k]=mk(n);sw(k)}
function closeShop(){let pf=sh.money-sh.ds;panel('پایان روز '+fa(sh.day),`<p style="text-align:center;font-size:26px">سود امروز: ${fa(pf)} تومان<br>پول شما: ${fa(sh.money)} تومان</p><button class=b onclick="nd()">شروع روز بعد</button>`)}
function nd(){sh.day++;sh.t=0;sh.ds=sh.money;cs=[];spT=3;save();cl()}
function start(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();started=1;cl()}
panel('کاسب محل','<p style="text-align:center;font-size:24px">مغازه‌ی قدیمی دماوند منتظر شماست.<br>مشتری را ببینید، کالا تحویل دهید و مغازه را بچرخانید.</p><button class=b onclick="start()">'+(sh.day>1||sh.money!=5000000?'ادامه بازی':'شروع بازی')+'</button>');
// ---- مشتری
const act=()=>cs.filter(c=>c.st<2),front=()=>{let c=act()[0];return c&&c.st==1&&away<=0?c:null};
const CL=['#b04a3a','#3a6bb0','#4a8a4a','#8a4a8a','#c08a2a','#2a7a8a'],SK=['#e3b58c','#c98f68','#f0c8a0','#a8704a'],HR=['#222','#553322','#888','#ddd'];
function spawn(){let av=P.filter(p=>(!p[8]||sh.eq.fridge)&&(!p[10]||sh.eq.shelf)),p=av[Math.random()*av.length|0],q=p[9]?(sh.eq.scale?[.5,1,1.5,2][Math.random()*4|0]:[1,2][Math.random()*2|0]):1+(Math.random()*3|0);cs.push({id:++uid,x:900,tx:420,st:0,p,q,sens:.85+Math.random()*.3,col:CL[Math.random()*6|0],sk:SK[Math.random()*4|0],hr:HR[Math.random()*4|0],f:Math.random()<.3,offer:0,msg:''});let c=cs[cs.length-1],r=Math.random()<.35&&REG.filter(a=>!cs.some(x=>x.n==a[0]));if(r&&r.length){r=r[Math.random()*r.length|0];let fr=sh.reg[r[0]]||0,fp=P[r[1]];c.p=fp;c.q=fp[9]?1:2;c.n=r[0];c.col=r[2];if(r[6])c.hr='#ddd';c.sens+=Math.min(.15,fr*.01);c.line=r[3+Math.min(2,fr/3|0)]}extra(c);bell()}
function fin(c,pr){let p=c.p;if(sh.stock[p[0]]<c.q)return toast('موجودی کافی نیست');sh.stock[p[0]]-=c.q;let tot=Math.round(pr*c.q);sh.money+=tot;if(c.more&&c.more.length){let n=c.more.shift();c.p=n[0];c.q=n[1];c.offer=0;c.msg='و...';lk=''}else{c.st=2;c.msg='ممنون!';if(!c.back&&Math.random()<.12)BK.push({d:8+Math.random()*10,n:c.n,col:c.col,sk:c.sk,hr:c.hr,f:c.f})}hand=1;coins.push({x:420,y:300,s:'+'+fa(tot),l:1});place();coin();rep(pr<=c.p[7]*1.05?2:1);if(c.n){sh.reg[c.n]=(sh.reg[c.n]||0)+1;if(sh.reg[c.n]%5==0){let g=Math.round(c.p[6]*.3/1000)*1000;sh.money+=g;toast(c.n+' انعام داد: '+fa(g)+' تومان');rep(2)}}save()}
